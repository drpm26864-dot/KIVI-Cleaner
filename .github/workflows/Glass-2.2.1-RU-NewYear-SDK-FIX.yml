      - name: Patch second row, localization and holiday wallpaper
        run: python3 glass-patch/patch_glass.py glass-upstream
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install API 36
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-latest runners include Android SDK; avoid the failing setup-android action.
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk_root" ]; then
            echo "::error::Android SDK root is missing: $sdk_root"
            exit 1
          fi
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi
          if [ -z "$sdkmanager_bin" ] || [ ! -x "$sdkmanager_bin" ]; then
            echo "::error::sdkmanager is not available on this runner"
            ls -lah "$sdk_root/cmdline-tools" || true
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          echo "SDK root: $sdk_root"
          echo "SDK manager: $sdkmanager_bin"
          "$sdkmanager_bin" --version
          # Install build dependencies; licenses are normally preaccepted on GitHub runners.
          "$sdkmanager_bin" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -s "$sdk_root/platforms/android-36/android.jar"
          echo "Android API 36 is installed"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Glass RU New Year APK
        shell: bash
        run: |
          cd glass-upstream
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK and rename
        shell: bash
        run: |
          mkdir -p artifacts
          test -s glass-upstream/app/build/outputs/apk/debug/app-debug.apk
          unzip -l glass-upstream/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/newyear_wallpaper.jpg'
          cp glass-upstream/app/build/outputs/apk/debug/app-debug.apk artifacts/Glass-2.2.1-RU-NewYear.apk
          sha256sum artifacts/*.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-2.2.1-RU-NewYear-APK
          path: artifacts/Glass-2.2.1-RU-NewYear.apk
          if-no-files-found: error
