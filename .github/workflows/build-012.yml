
name: Build KIVI Cleaner 0.1.12 ADB Console

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare project and ADB console
        shell: bash
        run: |
          cat > prepare.py <<'PY'
          import base64
          import io
          import lzma
          import pathlib
          import re
          import tarfile
          import urllib.request

          repo = "drpm26864-dot/KIVI-Cleaner"
          revision = "b42c557b3e6d9bc2a32fab9a7b6611fe6100af67"
          url = (
              "https://raw.githubusercontent.com/"
              + repo + "/" + revision
              + "/.github/workflows/build.yml"
          )
          workflow = urllib.request.urlopen(
              url, timeout=30
          ).read().decode("utf-8")

          match = re.search(
              r"base64 -d <<'SOURCE_ARCHIVE'"
              r"\s*\|\s*tar -xJf - -C kivi-cleaner"
              r"\s*\n(.*?)\n\s*SOURCE_ARCHIVE",
              workflow,
              re.S
          )
          if not match:
              raise RuntimeError("Source archive not found")

          encoded = "".join(match.group(1).split())
          data = lzma.decompress(
              base64.b64decode(encoded)
          )

          root = pathlib.Path("kivi-cleaner")
          root.mkdir(exist_ok=True)

          with tarfile.open(fileobj=io.BytesIO(data)) as tar:
              for member in tar.getmembers():
                  target = (root / member.name).resolve()
                  if not target.is_relative_to(root.resolve()):
                      raise RuntimeError("Unsafe archive path")
                  if member.issym() or member.islnk():
                      raise RuntimeError("Archive links not allowed")
              tar.extractall(root)

          java = root / (
              "app/src/main/java/ru/local/"
              "kivicleaner/MainActivity.java"
          )
          source = java.read_text(encoding="utf-8")

          marker = "        LinearLayout recommended = card();"
          assert marker in source

          ui = '''
                  LinearLayout consoleCard = card();
                  add(consoleCard, text("ADB-КОНСОЛЬ",
                      12, MINT, true), 0, 8);
                  add(consoleCard, text(
                      "Команды выполняются только на подключённом KIVI. "
                      + "Перед выполнением требуется подтверждение.",
                      13, MUTED, false), 0, 9);

                  final EditText commandEdit = new EditText(this);
                  commandEdit.setTextColor(WHITE);
                  commandEdit.setHintTextColor(MUTED);
                  commandEdit.setTextSize(13);
                  commandEdit.setSingleLine(true);
                  commandEdit.setHint("Введите ADB shell-команду");
                  add(consoleCard, commandEdit, 0, 8);

                  Button restoreButton = button(
                      "Подставить команду VpnDialogs", false);
                  restoreButton.setOnClickListener(v ->
                      commandEdit.setText(
                          "cmd package install-existing --user 0 "
                          + "com.android.vpndialogs"));
                  add(consoleCard, restoreButton, 0, 7);

                  final TextView consoleOutput = text(
                      "Ответ телевизора появится здесь.",
                      12, WHITE, false);
                  consoleOutput.setTextIsSelectable(true);

                  Button executeButton = button(
                      "Выполнить команду", true);
                  executeButton.setOnClickListener(v -> {
                      final String command =
                          commandEdit.getText().toString().trim();

                      if (adb == null) {
                          consoleOutput.setText(
                              "Сначала подключитесь к телевизору.");
                          return;
                      }
                      if (command.isEmpty()
                          || command.length() > 180
                          || command.contains("\\\\n")
                          || command.contains("\\\\r")) {
                          consoleOutput.setText(
                              "Неверная или слишком длинная команда.");
                          return;
                      }

                      new AlertDialog.Builder(this)
                          .setTitle("Подтвердить ADB-команду")
                          .setMessage(
                              "Выполнить на телевизоре?\\\\n\\\\n"
                              + command
                              + "\\\\n\\\\nКоманда может изменить "
                              + "настройки Android.")
                          .setNegativeButton("Отмена", null)
                          .setPositiveButton(
                              "Выполнить", (dialog, which) -> {
                              perform("ADB: выполнение команды", () -> {
                                  final String answer = adb.shell(
                                      connectedIp, 5555, command);
                                  runOnUiThread(() -> {
                                      consoleOutput.setText(
                                          "$ " + command + "\\\\n\\\\n"
                                          + answer);
                                      String old = getPreferences(
                                          MODE_PRIVATE).getString(
                                              "adb_console_history", "");
                                      String next = command + "\\\\n" + old;
                                      if (next.length() > 3000)
                                          next = next.substring(0, 3000);
                                      getPreferences(MODE_PRIVATE)
                                          .edit().putString(
                                              "adb_console_history",
                                              next).apply();
                                  });
                              });
                          }).show();
                  });
                  add(consoleCard, executeButton, 0, 8);

                  Button historyButton = button(
                      "История команд", false);
                  historyButton.setOnClickListener(v ->
                      consoleOutput.setText(
                          getPreferences(MODE_PRIVATE)
                              .getString("adb_console_history",
                                  "История пуста.")));
                  add(consoleCard, historyButton, 0, 7);

                  Button copyButton = button(
                      "Копировать результат", false);
                  copyButton.setOnClickListener(v -> {
                      android.content.ClipboardManager cm =
                          (android.content.ClipboardManager)
                          getSystemService(CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(
                          android.content.ClipData.newPlainText(
                              "ADB result",
                              consoleOutput.getText().toString()));
                  });
                  add(consoleCard, copyButton, 0, 8);
                  add(consoleCard, consoleOutput, 0, 0);
                  add(body, consoleCard, 0, 12);

          '''

          source = source.replace(marker, ui + marker, 1)
          java.write_text(source, encoding="utf-8")

          gradle = root / "app/build.gradle"
          config = gradle.read_text(encoding="utf-8")
          config = config.replace(
              "versionName '0.1.10'",
              "versionName '0.1.12'"
          )
          config = config.replace(
              'versionName "0.1.10"',
              'versionName "0.1.12"'
          )
          gradle.write_text(config, encoding="utf-8")

          print("ADB console source prepared")
          PY
          python3 prepare.py

      - name: Run tests
        run: bash kivi-cleaner/tests/test_core.sh

      - name: Install SDK 35
        run: |
          sdkmanager 'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p kivi-cleaner :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp \
            kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/KIVI-Cleaner-0.1.12-phone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIVI-Cleaner-0.1.12-ADB-Console
          path: artifacts/*.apk
          if-no-files-found: error
