      - name: Run ADB and VPN-probe tests
        run: bash kivi-cleaner/tests/test_core.sh
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build phone + TV companion APK
        run: gradle --no-daemon -p kivi-cleaner :app:assembleDebug
      - name: Check bundled TV APK
        shell: bash
        run: |
          test -s kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk
          test -s kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk
          unzip -p kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk assets/kivi-vpn-probe.apk > /tmp/kivi-vpn-probe.apk
          cmp /tmp/kivi-vpn-probe.apk kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk
      - name: Prepare output APKs
        shell: bash
        run: |
          mkdir -p artifacts
          cp kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk artifacts/KIVI-Cleaner-0.1.10-phone.apk
          cp kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk artifacts/KIVI-VPN-Probe-0.1.10-TV.apk
      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: KIVI-Cleaner-0.1.10-plus-TV-VPN-Probe
          path: artifacts/*.apk
          if-no-files-found: error
