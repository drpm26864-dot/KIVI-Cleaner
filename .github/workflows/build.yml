      - name: Run tests
        run: bash kivi-cleaner/tests/test_core.sh
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build phone and TV APKs
        run: gradle --no-daemon -p kivi-cleaner :app:assembleDebug
      - name: Check embedded TV APK
        shell: bash
        run: |
          unzip -p kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk assets/kivi-vpn-probe.apk > /tmp/kivi-probe.apk
          cmp /tmp/kivi-probe.apk kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk
      - name: Name APKs
        run: |
          mkdir -p artifacts
          cp kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk artifacts/KIVI-Cleaner-0.1.11-phone.apk
          cp kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk artifacts/KIVI-VPN-Probe-0.1.10-TV.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
