      - name: Run ADB core tests
        shell: bash
        working-directory: kivi-cleaner
        run: bash tests/test_core.sh
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        working-directory: kivi-cleaner
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK for phone
        uses: actions/upload-artifact@v4
        with:
          name: KIVI-Cleaner-0.1.0-APK
          path: kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
