name: TV Cleaner 0.1.14 - Universal Android TV / Yandex TV
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get tested 0.1.10 base
        uses: actions/checkout@v4
        with:
          ref: b42c557b3e6d9bc2a32fab9a7b6611fe6100af67
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore full 0.1.10 sources
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re,base64
          s=Path('.github/workflows/build.yml').read_text()
          m=re.search(r"base64 -d <<'SOURCE_ARCHIVE'\s*\|\s*tar -xJf - -C kivi-cleaner\s*\n(.*?)\n\s*SOURCE_ARCHIVE",s,re.S)
          if not m: raise RuntimeError('Base source not found')
          Path('source.tar.xz').write_bytes(base64.b64decode(''.join(m.group(1).split())))
          PYCODE
          mkdir kivi-cleaner
          tar -xJf source.tar.xz -C kivi-cleaner
