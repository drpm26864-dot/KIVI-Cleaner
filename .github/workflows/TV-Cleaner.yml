      - name: Check console integration and fix incorrect version labels
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          root = Path('kivi-cleaner')
          main = root / 'app/src/main/java/ru/local/kivicleaner/MainActivity.java'
          vpn = root / 'app/src/main/java/ru/local/kivicleaner/VpnProbeDiagnostics.java'
          text = main.read_text()
          # The bundled TV helper remains 0.1.10; the earlier patch had a wrong UI label.
          text = text.replace('Установите новую версию KIVI VPN Probe 0.1.11',
                              'Установите KIVI VPN Probe 0.1.10')
          main.write_text(text)
          report = vpn.read_text().replace('KIVI Cleaner 0.1.11 — расширенная',
                                           'KIVI Cleaner 0.1.12 — расширенная')
          vpn.write_text(report)
          # Fail early if an older source was accidentally restored.
          assert 'ADB-КОНСОЛЬ' in text
          assert 'runConsoleCommand()' in text
          assert 'AdbConsolePolicy.classify(command)' in text
          assert (root / 'app/src/main/java/ru/local/kivicleaner/AdbConsolePolicy.java').exists()
          print('PASS: ADB console is present and TV Probe version label is consistent')
          PYCODE
