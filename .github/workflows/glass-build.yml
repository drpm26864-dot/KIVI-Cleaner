      - name: Run all source and safety tests
        run: bash kivi-cleaner/tests/test_core.sh
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build phone and TV APKs
        run: gradle --no-daemon -p kivi-cleaner :app:assembleDebug
      - name: Verify bundled TV Probe
        shell: bash
        run: |
          test -s kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk
          test -s kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk
          unzip -p kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk assets/kivi-vpn-probe.apk > /tmp/embedded-probe.apk
          cmp /tmp/embedded-probe.apk kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk
      - name: Prepare APKs
        shell: bash
        run: |
          mkdir -p artifacts
          cp kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk artifacts/KIVI-Cleaner-0.1.14-Glass-phone.apk
          cp kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk artifacts/KIVI-VPN-Probe-0.1.10-TV.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: KIVI-Cleaner-0.1.14-Glass-and-TV-VPN-Probe
          path: artifacts/*
          if-no-files-found: error
