      - name: Run source and regression tests
        run: |
          test -s kivi-cleaner/tvsources/src/main/java/ru/local/kivitvsources/SourceCatalog.java
          bash kivi-cleaner/tests/test_core.sh
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build phone and TV APKs
        run: gradle --no-daemon -p kivi-cleaner :app:assembleDebug
      - name: Verify bundled companion APKs
        shell: bash
        run: |
          test -s kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk
          test -s kivi-cleaner/tvsources/build/outputs/apk/debug/tvsources-debug.apk
          test -s kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk
          unzip -p kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk assets/kivi-tv-sources.apk > /tmp/kivi-tv-sources.apk
          cmp /tmp/kivi-tv-sources.apk kivi-cleaner/tvsources/build/outputs/apk/debug/tvsources-debug.apk
          unzip -p kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk assets/kivi-vpn-probe.apk > /tmp/kivi-vpn-probe.apk
          cmp /tmp/kivi-vpn-probe.apk kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk
      - name: Give APKs clear filenames
        shell: bash
        run: |
          mkdir -p artifacts
          cp kivi-cleaner/app/build/outputs/apk/debug/app-debug.apk artifacts/KIVI-Cleaner-0.1.16-Sources-phone.apk
          cp kivi-cleaner/tvsources/build/outputs/apk/debug/tvsources-debug.apk artifacts/KIVI-TV-Sources-0.1.16-TV.apk
          cp kivi-cleaner/tvprobe/build/outputs/apk/debug/tvprobe-debug.apk artifacts/KIVI-VPN-Probe-0.1.10-TV.apk
      - name: Upload built APKs
        uses: actions/upload-artifact@v4
        with:
          name: KIVI-Cleaner-0.1.16-Sources-7-inputs
          path: artifacts/*.apk
          if-no-files-found: error
