name: Build Glass RU Realistic Motion Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/GlassMotion.yml'
      - 'Glass-Realistic-PATCH.zip'
      - '.github/workflows/Glass-Realistic-PATCH.zip'
permissions:
  contents: read
jobs:
  glass-realistic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack theme + verify assets
        shell: bash
        run: |
          set -euo pipefail
          archive=''
          for candidate in Glass-Realistic-PATCH.zip .github/workflows/Glass-Realistic-PATCH.zip; do
            if test -s "$candidate"; then archive="$candidate"; break; fi
          done
          test -n "$archive" || { echo '::error::Glass-Realistic-PATCH.zip was not uploaded to root or workflows'; exit 1; }
          mkdir -p patch
          unzip -q "$archive" -d patch
          for n in 01 02 03 04 05 06; do test -s "patch/winter_$n.jpg"; done
          test -s patch/patch_glass.py
          test -s patch/patch_realistic.py
          test -s patch/WinterAtmosphere.kt
      - name: Clone original Glass v2.2.1
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.2.1 https://github.com/tlfares/GlassLauncher.git glass-upstream
          test "$(git -C glass-upstream rev-parse --short=7 HEAD)" = '8c99033'
      - name: Apply realistic patches and regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 patch/patch_glass.py glass-upstream
          python3 patch/patch_realistic.py glass-upstream
          # Kotlin hotfix: prior patch left an extra private set in AppRepository.kt.
          sed -z -i 's/private set\n        private set/private set/g' glass-upstream/app/src/main/java/com/fares/glass/data/AppRepository.kt
      - name: Fix continuous snow and lights (independent of Android animations)
        shell: bash
        run: |
          set -euo pipefail
          python3 - glass-upstream <<'PY'
          #!/usr/bin/env python3
          """Patch Glass Realistic Winter's WinterAtmosphere to use the Compose frame clock.
          Run after the existing patch_glass.py and patch_realistic.py, never before.
          """
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          p = root / 'app/src/main/java/com/fares/glass/ui/WinterAtmosphere.kt'
          s = p.read_text(encoding='utf-8')

          old_imports = '''import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          '''
          new_imports = '''import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.runtime.withFrameNanos
          '''
          assert s.count(old_imports) == 1, 'Unrecognized WinterAtmosphere.kt imports'
          s = s.replace(old_imports, new_imports)
          old_animation = '''    val timeline = rememberInfiniteTransition(label = "winterAtmosphere")
              val snowPhase by timeline.animateFloat(
                  initialValue = 0f, targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(30000, easing = LinearEasing)),
                  label = "fallingSnowTimeline"
              )
              val glowPhase by timeline.animateFloat(
                  initialValue = 0f, targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(7400, easing = LinearEasing)),
                  label = "naturalLightTwinkle"
              )
          '''
          new_animation = '''    // Real frame clock, NOT rememberInfiniteTransition: works even if the Android
              // system Animator duration scale is 0 (common on older Android TV firmware).
              // Recompose only this small effect layer at up to ~30 FPS, never the whole home.
              var seconds by remember { mutableFloatStateOf(0f) }
              LaunchedEffect(active, snowLevel, glowEnabled) {
                  if (active && (snowLevel > 0 || glowEnabled)) {
                      var startNs = 0L
                      var lastNs = 0L
                      while (true) {
                          val now = withFrameNanos { it }
                          if (startNs == 0L) startNs = now
                          if (lastNs == 0L || now - lastNs >= 33_000_000L) {
                              seconds = (now - startNs) / 1_000_000_000f
                              lastNs = now
                          }
                      }
                  }
              }
              val snowPhase = (seconds % 25f) / 25f
              val glowPhase = (seconds % 5.6f) / 5.6f
          '''
          assert s.count(old_animation) == 1, 'Unrecognized old animation implementation'
          s=s.replace(old_animation,new_animation)
          substitutions = {
              'if (snowLevel == 1) 11 else 18': 'if (snowLevel == 1) 18 else 32',
              'if (snowLevel == 1) 14 else 24': 'if (snowLevel == 1) 25 else 38',
              'if (layer == 0) 0.21f else 0.40f': 'if (layer == 0) 0.42f else 0.74f',
              'if (layer == 0) 0.75f else 1.20f': 'if (layer == 0) 1.20f else 2.00f',
              'val brightness = 0.025f + 0.045f * pulse': 'val brightness = 0.055f + 0.18f * pulse',
              'radius=15.dp.toPx()': 'radius=20.dp.toPx()',
              'radius=5.dp.toPx()': 'radius=6.dp.toPx()',
          }
          for old,new in substitutions.items():
              assert s.count(old)==1, f'Expected exactly one occurrence of {old}'
              s=s.replace(old,new)
          # Only the effect layer redraws, and only while the home screen is visible.
          assert 'withFrameNanos' in s and 'LaunchedEffect(active, snowLevel, glowEnabled)' in s
          assert 'rememberInfiniteTransition(label = "winterAtmosphere")' not in s
          assert 'var seconds by remember { mutableFloatStateOf(0f) }' in s
          p.write_text(s, encoding='utf-8')
          print('WinterAtmosphere V2 patched: frame-clock snowfall and warm light pulse')
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (GitHub runner)
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root" || { echo "::error::Android SDK missing: $sdk_root"; exit 1; }
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then sdkmanager_bin="$(command -v sdkmanager || true)"; fi
          test -x "$sdkmanager_bin" || { echo '::error::sdkmanager missing'; exit 1; }
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          yes | "$sdkmanager_bin" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager_bin" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -s "$sdk_root/platforms/android-36/android.jar"
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd glass-upstream
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          for n in 01 02 03 04 05 06; do unzip -Z1 "$apk" | grep -qx "assets/winter_$n.jpg"; done
          grep -q 'WinterAtmosphere' app/src/main/java/com/fares/glass/ui/HomeScreen.kt
          grep -q 'withFrameNanos' app/src/main/java/com/fares/glass/ui/WinterAtmosphere.kt
          grep -q 'mutableFloatStateOf' app/src/main/java/com/fares/glass/ui/WinterAtmosphere.kt
          grep -q 'holiday_effects' app/src/main/res/values-ru/strings.xml
          mkdir -p ../artifacts
          cp "$apk" ../artifacts/Glass-2.2.1-RU-Realistic-MotionFix.apk
          sha256sum ../artifacts/*.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-RU-MotionFix-APK
          path: artifacts/Glass-2.2.1-RU-Realistic-MotionFix.apk
          if-no-files-found: error
