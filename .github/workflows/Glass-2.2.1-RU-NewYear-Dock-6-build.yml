name: Build Glass 2.2.1 RU New Year Dock 6
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build-glass-dock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout wallpapers and patch from this repository
        uses: actions/checkout@v4
      - name: Check and unpack patch archive
        shell: bash
        run: |
          set -euo pipefail
          test -s Glass-2.2.1-RU-NewYear-Dock-6-PATCH.zip || { echo '::error::Upload Glass-2.2.1-RU-NewYear-Dock-6-PATCH.zip to repository ROOT first'; exit 1; }
          mkdir -p glass-patch
          unzip -q Glass-2.2.1-RU-NewYear-Dock-6-PATCH.zip -d glass-patch
          for n in 01 02 03 04 05 06; do test -s "glass-patch/winter_$n.jpg"; done
      - name: Clone upstream Glass 2.2.1 (MIT)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.2.1 https://github.com/tlfares/GlassLauncher.git glass-upstream
          test "$(git -C glass-upstream rev-parse --short=7 HEAD)" = '8c99033'
      - name: Apply the six themed wallpapers, Russian UI and light motion
        shell: bash
        run: python3 glass-patch/patch_glass.py glass-upstream
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root" || { echo "::error::Android SDK missing: $sdk_root"; exit 1; }
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then sdkmanager_bin="$(command -v sdkmanager || true)"; fi
          test -x "$sdkmanager_bin" || { echo '::error::sdkmanager missing'; exit 1; }
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          "$sdkmanager_bin" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -s "$sdk_root/platforms/android-36/android.jar"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Android APK
        shell: bash
        run: |
          cd glass-upstream
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Verify resources and copy APK
        shell: bash
        run: |
          set -euo pipefail
          apk=glass-upstream/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          for n in 01 02 03 04 05 06; do unzip -Z1 "$apk" | grep -qx "assets/winter_$n.jpg"; done
          mkdir -p artifacts
          cp "$apk" artifacts/Glass-2.2.1-RU-NewYear-Dock-6.apk
          sha256sum artifacts/*.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-NewYear-Dock-6-APK
          path: artifacts/Glass-2.2.1-RU-NewYear-Dock-6.apk
          if-no-files-found: error
